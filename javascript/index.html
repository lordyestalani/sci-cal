<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scientific Calculator</title>
  <script src="calculator.js" defer></script>
  <style>
    body {
      max-width: 28rem;
      margin: 3rem auto;
      padding: 0 1rem;
      font: 1rem/1.5 system-ui, sans-serif;
    }
    form, label:not([hidden]) {
      display: grid;
      gap: 0.5rem;
    }
    form {
      gap: 1rem;
    }
    input, select, button {
      padding: 0.5rem;
      font: inherit;
    }
    output {
      font-weight: 600;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <main>
    <h1>Scientific Calculator</h1>
    <p>JavaScript · Step 3 — Logarithms</p>
    <form id="calculator" novalidate>
      <label>
        First number
        <input id="left" type="number" step="any" required>
      </label>
      <label>
        Operation
        <select id="operation">
          <option value="+">+ Addition</option>
          <option value="-">− Subtraction</option>
          <option value="*">× Multiplication</option>
          <option value="/">÷ Division</option>
          <option value="^">^ Power</option>
          <option value="sqrt">√ Square root</option>
          <option value="log">log Base-10 logarithm</option>
          <option value="ln">ln Natural logarithm</option>
        </select>
      </label>
      <label id="right-field">
        Second number
        <input id="right" type="number" step="any" required>
      </label>
      <button type="submit">Calculate</button>
      <output id="result" for="left operation right" aria-live="polite"></output>
    </form>
  </main>
</body>
</html>
